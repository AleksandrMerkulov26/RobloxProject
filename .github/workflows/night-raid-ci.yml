name: Validate NightRaid

on:
  pull_request:
    branches: [main]
    paths:
      - "NightRaid/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "NightRaid/**"
      - ".github/workflows/**"

jobs:
  build:
    name: Build game and test projects
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install project tools
        working-directory: NightRaid
        run: aftman install

      - name: Run Selene
        working-directory: NightRaid
        run: selene src

      - name: Build production game
        working-directory: NightRaid
        run: rojo build default.project.json --output /tmp/NightRaid.rbxlx

      - name: Build test project
        working-directory: NightRaid
        run: rojo build test.project.json --output /tmp/NightRaidTests.rbxlx
